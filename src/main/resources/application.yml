# Config común a todos los perfiles (lo que cambia por entorno: application-{dev,qa,prd}.yml)
spring:
  application:
    name: ms-control-gastos
  profiles:
    default: dev
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneipe_gastos}
    username: ${DB_USER:moneipe}
    password: ${DB_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneipe_gastos}
    user: ${DB_USER:moneipe}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
